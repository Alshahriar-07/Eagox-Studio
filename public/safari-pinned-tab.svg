<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" id="eagox-safari-pinned-tab">
  <!-- Outer Hexagon with thick rounded border -->
  <path
    d="M 50,5
       L 92,27.5
       L 92,72.5
       L 50,95
       L 8,72.5
       L 8,27.5
       Z"
    stroke="#09090b"
    strokeWidth="9.5"
    strokeLinejoin="round"
    strokeLinecap="round"
  />
  <!-- Lower-left rounded square -->
  <rect
    x="21"
    y="51"
    width="24"
    height="24"
    rx="5"
    fill="none"
    stroke="#09090b"
    strokeWidth="7"
  />
  <!-- Top branch line from square to filled circle -->
  <path
    d="M 33,51
       L 33,36
       Q 33,32 37,32
       L 62,32"
    stroke="#09090b"
    strokeWidth="7"
    strokeLinecap="round"
    strokeLinejoin="round"
  />
  <!-- Top right circular node -->
  <circle cx="65" cy="32" r="10" fill="#09090b" />
  <!-- Bottom branch line going right and down -->
  <path
    d="M 45,63
       L 67,63
       Q 71,63 71,67
       L 71,80"
    stroke="#09090b"
    strokeWidth="7"
    strokeLinecap="round"
    strokeLinejoin="round"
  />
</svg>